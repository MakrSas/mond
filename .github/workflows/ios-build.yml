name: iOS build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

          rm -rf Payload mond.ipa
          mkdir -p Payload
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload mond.ipa
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: mond-unsigned-ipa-${{ github.sha }}
          path: mond.ipa
          if-no-files-found: error
